# ===========================================================
# Decap CMS 配置文件（在线后台 /admin）
# 使用前请把下面两处占位符改成你自己的：
#   1) repo: 改成你的 GitHub 仓库，格式 用户名/仓库名
#   2) base_url: 改成你的 OAuth Worker 地址（见 README 的「配 GitHub 登录」）
# ===========================================================
backend:
  name: github
  repo: AmiyaT/leiafrin-blog
  branch: main
  base_url: https://1eafrin.icu
  auth_endpoint: /auth

# 上传的图片存这里（在后台正文里可直接插图）
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ---------- 站点整体信息 ----------
  - name: "site"
    label: "站点设置"
    files:
      - name: "site-config"
        label: "站点信息"
        file: "content/site.json"
        fields:
          - { name: title, label: "网站标题", widget: string }
          - { name: brand, label: "品牌名(导航左上角)", widget: string }
          - { name: intro, label: "首页简介", widget: text }
          - { name: about, label: "关于页内容", widget: markdown }

  # ---------- 文章 ----------
  # 注意：Decap 的 collection 只支持两种形态 —— 用 files:，或用 folder:+fields:。
  # 单文件（content/posts.json）也要写成 files: 里的一项，不能在 collection 上直接写 file:
  - name: "posts"
    label: "文章"
    files:
      - name: "posts-data"
        label: "文章数据"
        file: "content/posts.json"
        fields:
          - name: posts
            label: "文章列表"
            widget: list
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - name: slug
                label: "链接名(英文)"
                widget: string
                hint: "用于网址，例如 hello-world → 对应 post.html?p=hello-world，别用中文和空格"
              - { name: title, label: "标题", widget: string }
              - { name: date, label: "日期", widget: date }
              - { name: excerpt, label: "首页摘要", widget: text }
              - name: tags
                label: "标签"
                widget: list
                field: { name: tag, label: "标签", widget: string }
              - { name: body, label: "正文(Markdown)", widget: markdown }
